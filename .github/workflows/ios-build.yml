name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate generated project
        run: |
          test -f Helpora.xcodeproj/project.pbxproj
          xcodebuild -project Helpora.xcodeproj -scheme Helpora -showBuildSettings > build-settings.log

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild             -project Helpora.xcodeproj             -scheme Helpora             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -derivedDataPath build-simulator             CODE_SIGNING_ALLOWED=NO             build 2>&1 | tee build.log

      - name: Build unsigned device app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild             -project Helpora.xcodeproj             -scheme Helpora             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath build-device             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build 2>&1 | tee device-build.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH="$(find build-device/Build/Products -type d -name 'Helpora.app' | head -n 1)"
          test -n "$APP_PATH"
          rm -rf Payload Helpora-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Helpora.app
          /usr/bin/zip -qry Helpora-unsigned.ipa Payload

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: helpora-unsigned-ipa
          path: Helpora-unsigned.ipa
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helpora-build-diagnostics
          path: |
            build.log
            device-build.log
            build-settings.log
            build-simulator/**
            build-device/**
            ~/Library/Logs/DiagnosticReports/**
          if-no-files-found: ignore
