<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HELPORA Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3f8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;color:#17151d}.phone{max-width:430px;min-height:100vh;margin:auto;background:#fff}header{padding:52px 20px 16px;border-bottom:1px solid #eee}h1{font-size:30px;margin:0 0 6px}.sub{color:#777;font-size:15px}main{padding:20px}.ask{width:100%;border:0;border-radius:16px;padding:17px;background:#6b35d5;color:#fff;font-size:17px;font-weight:700}h2{font-size:21px;margin:25px 0 12px}.card{display:flex;align-items:center;padding:16px;margin:10px 0;background:#f8f7fb;border-radius:16px}.icon{font-size:22px;width:40px}.value{margin-left:auto;color:#777}.actions button{width:100%;padding:14px;margin:6px 0;border:1px solid #ddd;background:#fff;border-radius:13px;text-align:left;font-size:16px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:flex;justify-content:space-around;padding:12px 5px;background:#fff;border-top:1px solid #eee}nav button{border:0;background:none;color:#666;font-size:12px}nav button.active{color:#6b35d5;font-weight:700}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(430px,100%);border-radius:24px 24px 0 0;padding:22px}.sheet input,.sheet textarea,.sheet select{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #ddd;border-radius:11px;font:inherit}.save{width:100%;padding:14px;border:0;border-radius:12px;background:#6b35d5;color:white;font-weight:700}</style></head><body><div class="phone"><header><h1>HELPORA</h1><div class="sub">Together we are stronger.</div></header><main><h1>Hello 👋</h1><div class="sub">Find help, offer support and build a safer community.</div><button class="ask" onclick="openSheet()">＋ Ask for help</button><h2>Community today</h2><div class="card"><div class="icon">❤️</div><div>Open requests</div><div class="value" id="requests">0</div></div><div class="card"><div class="icon">👥</div><div>Your HP points</div><div class="value">0</div></div><div class="card"><div class="icon">🛡️</div><div>Safety first</div><div class="value">Trust Center</div></div><h2>Quick actions</h2><div class="actions"><button>🔔 Notifications</button><button>🛡️ Safety and trust</button></div></main><nav><button class="active">⌂<br>Home</button><button>◉<br>Discover</button><button>♥<br>Help</button><button>💬<br>Inbox</button><button>●<br>Profile</button></nav></div><div class="modal" id="modal"><div class="sheet"><h2>Ask for help</h2><input id="title" placeholder="Short title"><textarea id="details" rows="4" placeholder="Describe your request"></textarea><select><option>General</option><option>Daily life</option><option>Community</option><option>Translation</option><option>Jobs</option><option>Housing</option><option>Emergency guidance</option></select><button class="save" onclick="saveRequest()">Save request</button></div></div><script>function openSheet(){document.getElementById('modal').style.display='flex'}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.style.display='none'}function saveRequest(){if(!document.getElementById('title').value.trim())return alert('Enter a title');document.getElementById('requests').textContent=+document.getElementById('requests').textContent+1;document.getElementById('modal').style.display='none';}</script></body></html>
