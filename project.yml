name: Helpora
options:
  bundleIdPrefix: com.helpora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

targets:
  Helpora:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - ".git/**"
          - ".github/**"
          - "Docs/**"
          - "project.yml"
          - "README.md"
          - "PrivacyInfo.xcprivacy"
    resources:
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpora.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HELPORA
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
